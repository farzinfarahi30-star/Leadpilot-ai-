name = "leadpilot-ai"
main = "src/index.js"
compatibility_date = "2026-08-20"

[assets]
directory = "public"
binding = "ASSETS"

[vars]
APP_NAME = "LeadPilot AI"
PRICE_GBP = "49"

# Create the D1 database in your Cloudflare account, then replace the placeholder below.
[[d1_databases]]
binding = "DB"
database_name = "leadpilot"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

[triggers]
crons = ["*/15 * * * *"]
