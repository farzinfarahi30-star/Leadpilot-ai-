<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create your LeadPilot account</title><link rel="stylesheet" href="styles.css"></head><body><main class="start" style="max-width:620px;margin:80px auto;display:block"><div class="eyebrow">GET STARTED</div><h1>Create your LeadPilot account</h1><form id="signup"><label>Business name<input name="business_name" required></label><label>Email<input type="email" name="email" required></label><label>Password<input type="password" name="password" minlength="8" required></label><button class="btn primary full">Create account</button><p id="msg" class="micro"></p><p class="micro">Already have an account? <a href="/login.html" style="text-decoration:underline">Log in</a>.</p></form></main><script>signup.onsubmit=async e=>{e.preventDefault();msg.textContent='Creating account…';const b=Object.fromEntries(new FormData(e.target));const r=await fetch('/api/signup',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)});const x=await r.json();if(r.ok)location.href=x.next;else msg.textContent=x.error||'Could not create account';}</script><script>const q=new URLSearchParams(location.search);for(const k of ['business','email']){const el=signup.elements[k==='business'?'business_name':k];if(el&&q.get(k))el.value=q.get(k)}</script></body></html>
