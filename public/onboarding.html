<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Onboarding — LeadPilot AI</title><link rel="stylesheet" href="styles.css"></head><body><main class="start" style="max-width:720px;margin:50px auto"><div class="eyebrow">ONBOARDING</div><h1>Set up your lead follow-up system</h1><form id="on"><label>Business name<input name="business_name"></label><label>Website<input name="website"></label><label>Main service<input name="service" required></label><label>Ideal customer<input name="audience"></label><label>Phone<input name="phone"></label><label>Booking URL<input name="booking_url"></label><label>Tone<select name="tone"><option>friendly</option><option>professional</option><option>casual</option></select></label><label>Opening hours<input name="hours"></label><button class="btn primary full">Save setup</button><p id="msg" class="micro"></p></form></main><script>(async()=>{const m=await fetch('/api/me');if(!m.ok)return location.href='/login.html';const r=await fetch('/api/onboarding');if(r.ok){const x=await r.json();for(const [k,v] of Object.entries(x)){const el=on.elements[k];if(el)el.value=v||''}}})();on.onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/onboarding',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(on)))});const x=await r.json();msg.textContent=r.ok?'Saved. Your dashboard is ready.':(x.error||'Could not save');if(r.ok)setTimeout(()=>location.href='/dashboard.html',700)}</script></body></html>
