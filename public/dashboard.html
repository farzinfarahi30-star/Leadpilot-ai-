<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard — LeadPilot AI</title><link rel="stylesheet" href="styles.css"></head><body><header class="nav"><a class="brand" href="/"><span class="logo">✦</span> LeadPilot <b>AI</b></a><nav><a href="/onboarding.html">Settings</a><button id="logout" class="btn ghost">Log out</button></nav></header><main class="section"><div class="eyebrow">DASHBOARD</div><h1 id="welcome">Your leads</h1><div class="price-card" style="margin:24px 0"><h3>Subscription</h3><p id="plan">Loading…</p><button id="pay" class="btn primary">Start £49/month</button></div><div class="dashboard" style="padding:24px"><h3>Recent leads</h3><div id="leads">Loading…</div></div></main><script>async function load(){const m=await fetch('/api/me');if(!m.ok)return location.href='/login.html';const a=(await m.json()).account;welcome.textContent=`${a.business_name||'Your'} leads`;plan.textContent=`Plan: ${a.plan} · Status: ${a.status}`;if(a.status==='active'&&a.plan!=='trial')pay.style.display='none';const r=await fetch('/api/leads');const ls=await r.json();leads.innerHTML=ls.length?ls.map(l=>`<div style="padding:14px 0;border-bottom:1px solid #ddd"><b>${esc(l.name)}</b> · ${esc(l.email||'No email')}<br><small>${esc(l.message||'')}</small><br><small>Status: ${esc(l.status)} · Follow-ups: ${l.followup_count}</small></div>`).join(''):'No leads yet.'}function esc(x){return String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}pay.onclick=async()=>{pay.disabled=true;const r=await fetch('/api/create-checkout',{method:'POST'});const x=await r.json();if(x.url)location.href=x.url;else{alert(x.error);pay.disabled=false}};logout.onclick=async()=>{await fetch('/api/logout',{method:'POST'});location.href='/'};load();</script></body></html>
