<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Log in — LeadPilot AI</title><link rel="stylesheet" href="styles.css"></head><body><main class="start" style="max-width:620px;margin:80px auto"><div class="eyebrow">WELCOME BACK</div><h1>Log in to LeadPilot</h1><form id="login"><label>Email<input type="email" name="email" required></label><label>Password<input type="password" name="password" required></label><button class="btn primary full">Log in</button><p id="msg" class="micro"></p></form></main><script>login.onsubmit=async e=>{e.preventDefault();const b=Object.fromEntries(new FormData(e.target));const r=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)});const x=await r.json();if(r.ok)location.href='/dashboard.html';else msg.textContent=x.error||'Login failed';}</script></body></html>
